name: SecDepth dependency scan

on:
  pull_request:
    branches: [main]

concurrency:
  group: secdepth-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: kobaltoxid/security-runtime/.github/workflows/scan.yml@4879ee46dc9ce62c224a708da11d869aabe5e5eb
    with:
      ecosystem: go
